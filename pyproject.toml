[project]
name = "aws-crud-api-lambda-dynamodb"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Mirror canônico: errors + unused + timezone-aware datetimes.
# Lab CORS "*" in template.yaml / Access-Control-Allow-Origin remains intentional
# for the SAM demo — do not tighten in this PR.
select = ["E", "F", "W", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
files = ["tests"]

[[tool.mypy.overrides]]
module = "src.*"
ignore_errors = true
