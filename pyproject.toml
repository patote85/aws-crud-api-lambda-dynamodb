[project]
name = "aws-crud-api-lambda-dynamodb"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Mirror canônico: errors + unused + timezone-aware datetimes.
select = ["E", "F", "W", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
# Typecheck tests + domain_items (HTTP app.py stays out).
# No ignore_errors on domain.
files = ["tests", "src/domain_items.py"]
